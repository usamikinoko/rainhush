{{define "heatmap"}}
<div class="home-heatmap">
    <div class="heatmap-header">
        <span class="heatmap-title">热力图</span>
        <span class="heatmap-total">过去一年共 {{.HeatmapTotal}} 篇更新</span>
    </div>
    <div class="heatmap-scroll">
        <div class="heatmap-grid">
            <div class="heatmap-months">
                {{range .HeatmapMonths}}<span class="heatmap-month" style="left: calc((100% / 53) * {{.Col}})">{{.Label}}</span>{{end}}
            </div>
            <div class="heatmap-labels">
                {{range .HeatmapDayLabels}}<span class="heatmap-label">{{.}}</span>{{end}}
            </div>
            <div class="heatmap-weeks">
                {{range .HeatmapCells}}<span class="heatmap-cell heatmap-l{{.Level}}" tabindex="0"><span class="heatmap-tooltip"><span class="heatmap-tooltip-date">{{.Date}}</span><span class="heatmap-tooltip-count">{{if eq .Count 0}}无更新{{else}}{{.Count}} 篇更新{{end}}</span></span></span>{{end}}
            </div>
        </div>
    </div>
    <div class="heatmap-legend" aria-hidden="true">
        <span>少</span>
        <span class="heatmap-legend-cell heatmap-l0"></span>
        <span class="heatmap-legend-cell heatmap-l1"></span>
        <span class="heatmap-legend-cell heatmap-l2"></span>
        <span class="heatmap-legend-cell heatmap-l3"></span>
        <span class="heatmap-legend-cell heatmap-l4"></span>
        <span>多</span>
    </div>
    <div class="heatmap-divider"></div>
</div>
{{end}}
