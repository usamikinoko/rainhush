{{define "c/post-item"}}<article class="post-item">
                        <div class="post-item-row">
                            <h3><a class="post-item-title" href="/articles/{{.Filename}}/">{{.Title}}</a></h3>
                            {{if .Date}}<time datetime="{{.Date}}">{{.Date}}</time>{{end}}
                        </div>
                        {{if .Excerpt}}
                        <p class="excerpt">{{.Excerpt}}</p>
                        {{end}}
                        <div class="post-item-more">
                            <a href="/articles/{{.Filename}}/">Read{{icon "arrow-right" "post-item-more-icon"}}</a>
                        </div>
                    </article>{{end}}
